  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;

      background: #0a0a0b;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;

      padding: 24px;

      border: 1px solid #2c2c2e; border-radius: 999px;
      font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: #a1a1a6;

  <main>
